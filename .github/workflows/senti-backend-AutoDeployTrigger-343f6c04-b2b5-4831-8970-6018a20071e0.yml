name: Trigger auto deployment for senti-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/senti-backend-AutoDeployTrigger-343f6c04-b2b5-4831-8970-6018a20071e0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SENTIBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SENTIBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SENTIBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: sentiback.azurecr.io
          registryUsername: ${{ secrets.SENTIBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SENTIBACKEND_REGISTRY_PASSWORD }}
          containerAppName: senti-backend
          resourceGroup: backend-rg
          imageToBuild: sentiback.azurecr.io/senti-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


