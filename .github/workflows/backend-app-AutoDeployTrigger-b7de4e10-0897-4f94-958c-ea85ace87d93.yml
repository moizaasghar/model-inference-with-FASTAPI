name: Trigger auto deployment for backend-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/backend-app-AutoDeployTrigger-b7de4e10-0897-4f94-958c-ea85ace87d93.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKENDAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKENDAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: appbackend.azurecr.io
          registryUsername: ${{ secrets.BACKENDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BACKENDAPP_REGISTRY_PASSWORD }}
          containerAppName: backend-app
          resourceGroup: model-inference-app
          imageToBuild: appbackend.azurecr.io/backend-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


